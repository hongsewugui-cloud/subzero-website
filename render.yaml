services:
  - type: web
    name: subzero-website-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: subzero-db
          property: connectionString
      - key: SUBZERO_ADMIN_KEY
        sync: false

  - type: pserv
    name: subzero-db
    plan: free
